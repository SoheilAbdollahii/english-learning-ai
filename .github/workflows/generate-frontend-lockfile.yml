name: Generate frontend lockfile

on:
  push:
    branches: ["fix/frontend-lockfile-and-rate-limit-cache"]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore: generate frontend npm lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile with npm
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if [ -z "$(git status --porcelain frontend/package-lock.json)" ]; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: generate frontend npm lockfile"
          git push
